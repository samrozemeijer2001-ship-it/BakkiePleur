<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CAFFEINE</title>
  <meta name="description" content="Track caffeine, see an estimate of what's still in the tank, and learn one Fun Fact and one Mythbusters a day. Data stays on your device.">
  <meta name="theme-color" content="#f3ede4">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Caffeine">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/rubik-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="screen" tabindex="-1"></main>

  <nav id="tabbar" class="tabbar" aria-label="Main">
    <button type="button" data-route="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.2 12 4.8l8 6.4v8.3a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9V21H5.5A1.5 1.5 0 0 1 4 19.5z"/></svg>
      <span>Home</span>
    </button>
    <button type="button" data-route="sleep">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.6 14.6A8 8 0 1 1 9.4 4.4a6.4 6.4 0 0 0 10.2 10.2z"/></svg>
      <span>Sleep</span>
    </button>
    <button type="button" data-route="discover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="11.5" height="13.5" rx="2.6"/><path d="M8.5 3.5h9.4a2.6 2.6 0 0 1 2.6 2.6v10.4"/></svg>
      <span>Discover</span>
    </button>
    <button type="button" data-route="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-7M10 20V6.5M15 20v-9.5M20 20V9"/></svg>
      <span>History</span>
    </button>
  </nav>

  <div id="toast-root" aria-live="polite"></div>

  <noscript>
    <p style="padding:24px;font-family:sans-serif;font-weight:700">CAFFEINE needs JavaScript to run.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
